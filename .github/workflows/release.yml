name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist, e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build, test, bundle .mcpb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle .mcpb
        run: npx -y @anthropic-ai/mcpb pack . cozi-mcp-${{ github.event.inputs.tag || github.ref_name }}.mcpb

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: cozi-mcp-*.mcpb
          retention-days: 7

  release:
    name: Attach .mcpb to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download .mcpb artifact
        uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: cozi-mcp-*.mcpb
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
    # Requires this repo + `release.yml` to be registered as a trusted publisher
    # for the package at npmjs.com → package settings → Trusted Publisher.
    permissions:
      contents: read
      id-token: write    # required for OIDC token exchange and `npm publish --provenance`
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Node 24, deliberately newer than the build job's Node 20: OIDC trusted
      # publishing needs npm >= 11.5.1, and Node 20 ships npm 10.8.2.
      #
      # `registry-url` is deliberately NOT set here. That input makes setup-node
      # write an .npmrc containing an `_authToken` line and export a placeholder
      # NODE_AUTH_TOKEN — and npm CLI only attempts the OIDC exchange when it
      # finds no token configured, so its presence silently defeats trusted
      # publishing. registry.npmjs.org is the default registry anyway.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (trusted publisher / OIDC — no-op if version already published)
        run: |
          # Publishes via npm Trusted Publishing (OIDC). The `id-token: write`
          # permission above lets npm CLI exchange a short-lived GitHub OIDC token
          # for a publish grant, given npmjs.com has this repo + workflow filename
          # registered as a trusted publisher for the package.
          #
          # Upgrade npm if a newer one is available, but don't fail the job if the
          # newest npm doesn't support this Node — Node 24's bundled npm 11.x
          # already supports OIDC.
          npm install -g npm@latest || echo "npm upgrade skipped — using bundled npm"
          echo "node $(node --version) / npm $(npm --version)"
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping (re-trigger is safe)"
            exit 0
          fi
          npm publish --access public --provenance

  smithery-publish:
    name: Publish to Smithery
    needs: build
    runs-on: ubuntu-latest
    # Skipped automatically when SMITHERY_API_KEY secret is not set.
    # To enable: Settings → Secrets → Actions → New repository secret named SMITHERY_API_KEY
    steps:
      - name: Download .mcpb artifact
        uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle

      - name: Publish to Smithery (no-op if SMITHERY_API_KEY unset)
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "${SMITHERY_API_KEY}" ]; then
            echo "SMITHERY_API_KEY secret not set — skipping Smithery publish"
            exit 0
          fi
          BUNDLE=$(ls cozi-mcp-*.mcpb | head -1)
          echo "Publishing $BUNDLE to mjucius/cozi-mcp"
          npx -y @smithery/cli mcp publish "./$BUNDLE" -n mjucius/cozi-mcp
