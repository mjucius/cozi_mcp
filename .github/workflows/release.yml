name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist, e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  # Resolves the tag ONCE for every downstream job and refuses anything that is
  # not a real version tag.
  #
  # Every job used to compute `github.event.inputs.tag || github.ref_name`
  # independently. On a workflow_dispatch where the `tag` input is empty that
  # falls back to the *branch* name, so a dispatch from main resolved to "main"
  # — and softprops/action-gh-release happily created a `main` tag plus a
  # release literally named "main", which then outranked v2.1.0 as "Latest".
  # That happened on 2026-07-30 and had to be cleaned up by hand.
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Refusing to release '$TAG' — expected a version tag such as v2.1.1."
            echo "If this was a manual run, supply the 'tag' input; an empty input falls back"
            echo "to the branch name, which would tag and publish a release named '$TAG'."
            exit 1
          fi

          if ! git ls-remote --exit-code --tags "$REPO" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in this repository."
            echo "Create and push it first: git tag $TAG && git push origin $TAG"
            exit 1
          fi

          echo "Releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test, bundle .mcpb
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle .mcpb
        run: npx -y @anthropic-ai/mcpb pack . cozi-mcp-${{ needs.validate-tag.outputs.tag }}.mcpb

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundle
          path: cozi-mcp-*.mcpb
          retention-days: 7

      # sign-worker signs this file only if it is byte for byte the one npm published.
      - name: Upload worker.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-bundle
          path: dist/worker.js
          retention-days: 7

  release:
    name: Attach .mcpb to GitHub Release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download .mcpb artifact
        uses: actions/download-artifact@v8
        with:
          name: mcpb-bundle

      - name: Create / update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          files: cozi-mcp-*.mcpb
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm-publish:
    name: Publish to npm
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
    # Requires this repo + `release.yml` to be registered as a trusted publisher
    # for the package at npmjs.com → package settings → Trusted Publisher.
    permissions:
      contents: read
      id-token: write    # required for OIDC token exchange and `npm publish --provenance`
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      # Node 24, deliberately newer than the build job's Node 22: OIDC trusted
      # publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x.
      #
      # `registry-url` is deliberately NOT set here. That input makes setup-node
      # write an .npmrc containing an `_authToken` line and export a placeholder
      # NODE_AUTH_TOKEN — and npm CLI only attempts the OIDC exchange when it
      # finds no token configured, so its presence silently defeats trusted
      # publishing. registry.npmjs.org is the default registry anyway.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (trusted publisher / OIDC — no-op if version already published)
        run: |
          # Publishes via npm Trusted Publishing (OIDC). The `id-token: write`
          # permission above lets npm CLI exchange a short-lived GitHub OIDC token
          # for a publish grant, given npmjs.com has this repo + workflow filename
          # registered as a trusted publisher for the package.
          #
          # Upgrade npm if a newer one is available, but don't fail the job if the
          # newest npm doesn't support this Node — Node 24's bundled npm 11.x
          # already supports OIDC.
          npm install -g npm@latest || echo "npm upgrade skipped — using bundled npm"
          echo "node $(node --version) / npm $(npm --version)"
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping (re-trigger is safe)"
            exit 0
          fi
          npm publish --access public --provenance

  # Signs dist/worker.js so deployed Cloudflare servers install it (about 3 days after they
  # first see it). The worker-signing environment holds the key and makes this job wait for
  # the maintainer's approval; it accepts only v* tags. The key reaches only the last step,
  # which runs Node built-ins, npm pack and gh, and no installed dependencies.
  sign-worker:
    name: Sign worker.js for Cloudflare servers
    needs: [validate-tag, build, release, npm-publish]
    runs-on: ubuntu-latest
    environment: worker-signing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          # The previous release's tag and src/update-keys.ts decide whether the key is trusted yet.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download worker.js artifact
        uses: actions/download-artifact@v8
        with:
          name: worker-bundle
          path: built

      - name: Sign and upload
        env:
          WORKER_SIGNING_KEY: ${{ secrets.WORKER_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
        run: node scripts/release-sign-ci.mjs "$TAG" built/worker.js
