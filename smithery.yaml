runtime: typescript
target: dist/server.js
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
        title: Cozi username
        description: Your Cozi account email address.
      password:
        type: string
        title: Cozi password
        description: Your Cozi account password.
        format: password
      readOnly:
        type: boolean
        title: Read-only mode
        description: Only expose read tools and hide tools that create, update, or delete Cozi data.
        default: false
