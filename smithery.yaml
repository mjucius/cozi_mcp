runtime: typescript
target: dist/server.js
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
        title: Cozi username
        description: >-
          Your Cozi account email address. These credentials are the
          authentication principal for this session — anyone able to supply
          them has full access to this Cozi account.
        format: password
      password:
        type: string
        title: Cozi password
        description: >-
          Your Cozi account password. These credentials are the authentication
          principal for this session — possession of valid Cozi credentials is
          the only access control.
        format: password
      readOnly:
        type: boolean
        title: Read-only mode
        description: Only expose read tools and hide tools that create, update, or delete Cozi data.
        default: false
